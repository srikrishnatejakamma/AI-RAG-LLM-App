<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1710" viewBox="0 0 1440 1710" role="img" aria-labelledby="title desc"><title id="title">03  Collection question answering</title><desc id="desc">The API chooses local retrieval or hosted File Search. Provider failure and evidence checks are shown separately.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="1710" fill="#f6f8fc"/><rect x="0" y="0" width="1440" height="120" rx="0" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="48" y="24" font-size="34" fill="#ffffff" font-weight="700" dominant-baseline="text-before-edge">03  Collection question answering</text><text x="48" y="76" font-size="18" fill="#cfdeed" font-weight="400" dominant-baseline="text-before-edge">The API chooses local retrieval or hosted File Search. Provider failure and evidence checks are shown separately.</text><polyline points="720,300 720,350 375,350 375,395" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,395 368,383 382,383" fill="#72879b"/><text x="230" y="360" font-size="16" fill="#72879b" font-weight="700" dominant-baseline="text-before-edge">Local retrieval</text><polyline points="720,350 1110,350 1110,395" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1110,395 1103,383 1117,383" fill="#72879b"/><text x="1010" y="360" font-size="16" fill="#72879b" font-weight="700" dominant-baseline="text-before-edge">Hosted retrieval</text><polyline points="375,625 375,690" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,690 368,678 382,678" fill="#72879b"/><polyline points="690,760 755,760" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="755,760 743,753 743,767" fill="#72879b"/><polyline points="375,830 375,895" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,895 368,883 382,883" fill="#72879b"/><polyline points="1110,625 1410,625 1410,1000 1380,1000" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1380,1000 1392,993 1392,1007" fill="#72879b"/><polyline points="375,1125 375,1190" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,1190 368,1178 382,1178" fill="#72879b"/><polyline points="1110,1105 1250,1105 1250,1520 1120,1520" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1120,1520 1132,1513 1132,1527" fill="#72879b"/><polyline points="375,1330 375,1410 720,1410 720,1450" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1450 713,1438 727,1438" fill="#72879b"/><rect x="320" y="155" width="800" height="145" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="338" y="177" width="5" height="101" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="356" y="175" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">1  Submit and validate a question</text><text x="356" y="213" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">POST /api/collections/{id}/chat; authenticated session + CSRF.</text><text x="356" y="240" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Require an existing collection and non-empty question (up to 2,000 chars).</text><text x="356" y="267" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python resolves follow-ups from the last eight messages; Java uses the question.</text><rect x="60" y="395" width="630" height="230" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="78" y="417" width="5" height="186" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="96" y="415" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">2A  Retrieve local evidence</text><text x="96" y="453" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java: embed query -&gt; collection-scoped vector search.</text><text x="96" y="480" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java summaries: candidates from the full collection.</text><text x="96" y="507" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python: spelling/context handling -&gt; hybrid retrieval.</text><text x="96" y="534" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python date questions can use direct fact extraction.</text><text x="96" y="561" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Use READY documents; default top-k 10 (range 3-20).</text><rect x="840" y="395" width="540" height="230" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="858" y="417" width="5" height="186" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="876" y="415" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">2B  OpenAI hosted File Search</text><text x="876" y="453" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Call Responses with the file_search tool.</text><text x="876" y="480" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Filter results by collection_id.</text><text x="876" y="507" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Map remote file IDs to local READY documents.</text><text x="876" y="534" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Require both answer text and usable citations.</text><text x="876" y="561" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Missing configuration / service failure -&gt; API error.</text><rect x="60" y="690" width="630" height="140" rx="16" fill="#ffffff" stroke="#d6e1eb" stroke-width="2"/><rect x="78" y="712" width="5" height="96" rx="2" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="96" y="710" font-size="22" fill="#142b43" font-weight="700" dominant-baseline="text-before-edge">3  Evidence available?</text><text x="96" y="748" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No matches -&gt; explicit no-evidence response.</text><text x="96" y="775" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">If ingestion is active, ask the user to retry shortly.</text><text x="96" y="802" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">With matches, build labeled source passages.</text><rect x="755" y="690" width="625" height="140" rx="16" fill="#fff1ee" stroke="#efb9ac" stroke-width="2"/><rect x="773" y="712" width="5" height="96" rx="2" fill="#a04432" stroke="#a04432" stroke-width="2"/><text x="791" y="710" font-size="22" fill="#a04432" font-weight="700" dominant-baseline="text-before-edge">No evidence</text><text x="791" y="748" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Return message + grounded: false.</text><text x="791" y="775" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No local source matches -&gt; sources: [].</text><text x="791" y="802" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Record NO_EVIDENCE / PROCESSING audit outcome.</text><rect x="60" y="895" width="630" height="230" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="78" y="917" width="5" height="186" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="96" y="915" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">4A  Generate from retrieved passages</text><text x="96" y="953" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java: Spring AI when selected/available; OpenAI path.</text><text x="96" y="980" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python: OpenAI agent orchestration when available.</text><text x="96" y="1007" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Missing credentials / provider failure: extractive fallback.</text><text x="96" y="1034" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Prompt: document text is evidence, never instructions.</text><text x="96" y="1061" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python summaries can use full-collection fallback context.</text><rect x="840" y="895" width="540" height="210" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="858" y="917" width="5" height="166" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="876" y="915" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">4B  Hosted answer + citations</text><text x="876" y="953" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Return provider answer with matched file excerpts.</text><text x="876" y="980" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No answer or citations -&gt; grounded: false.</text><text x="876" y="1007" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Hosted citations do not include local PDF pages.</text><text x="876" y="1034" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Hosted failures return errors; no local-search fallback.</text><rect x="60" y="1190" width="630" height="140" rx="16" fill="#ffffff" stroke="#d6e1eb" stroke-width="2"/><rect x="78" y="1212" width="5" height="96" rx="2" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="96" y="1210" font-size="22" fill="#142b43" font-weight="700" dominant-baseline="text-before-edge">5  Build local citations</text><text x="96" y="1248" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Document ID/name, chunk index, excerpt, PDF page.</text><text x="96" y="1275" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python also supplies sourceLocation when available.</text><text x="96" y="1302" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python rejects unsupported extractive answers.</text><rect x="320" y="1450" width="800" height="145" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="338" y="1472" width="5" height="101" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="356" y="1470" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">6  Return response and render sources</text><text x="356" y="1508" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">ChatResponse contains answer, sources, and grounded fields.</text><text x="356" y="1535" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Record question-answer audit outcome; browser shows answer and source cards.</text><text x="356" y="1562" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java currently sets grounded: true whenever local retrieval found matches.</text><text x="48" y="1672" font-size="16" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GATHER  /  Implementation workflows  /  Java + Python are primary backend options</text></g></svg>