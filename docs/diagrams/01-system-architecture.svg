<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc"><title id="title">01  System architecture</title><desc id="desc">Choose either primary backend. Both expose collection, document, chat, session, and audit APIs.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="1260" fill="#f6f8fc"/><rect x="0" y="0" width="1440" height="120" rx="0" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="48" y="24" font-size="34" fill="#ffffff" font-weight="700" dominant-baseline="text-before-edge">01  System architecture</text><text x="48" y="76" font-size="18" fill="#cfdeed" font-weight="400" dominant-baseline="text-before-edge">Choose either primary backend. Both expose collection, document, chat, session, and audit APIs.</text><polyline points="720,300 720,335 375,335 375,375" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,375 368,363 382,363" fill="#72879b"/><polyline points="720,335 1065,335 1065,375" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1065,375 1058,363 1072,363" fill="#72879b"/><polyline points="375,645 375,710" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="375,710 368,698 382,698" fill="#72879b"/><polyline points="1065,645 1065,710" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1065,710 1058,698 1072,698" fill="#72879b"/><polyline points="60,510 28,510 28,1000 60,1000" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="60,1000 48,993 48,1007" fill="#72879b"/><polyline points="1380,510 1412,510 1412,1000 1380,1000" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1380,1000 1392,993 1392,1007" fill="#72879b"/><rect x="320" y="155" width="800" height="145" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="338" y="177" width="5" height="101" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="356" y="175" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">Browser workspace / React UI</text><text x="356" y="213" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Vite: localhost:5173/react/; API proxy targets localhost:8080.</text><text x="356" y="240" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java also serves the built-in UI at / and packaged React at /react/.</text><text x="356" y="267" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Select a backend on port 8080, or update the proxy for another port.</text><rect x="60" y="375" width="630" height="270" rx="16" fill="#eaf7f3" stroke="#a2d7c7" stroke-width="2"/><rect x="78" y="397" width="5" height="226" rx="2" fill="#11634d" stroke="#11634d" stroke-width="2"/><text x="96" y="395" font-size="22" fill="#11634d" font-weight="700" dominant-baseline="text-before-edge">JAVA  |  Primary backend</text><text x="96" y="433" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Spring Boot API + Spring Security sessions</text><text x="96" y="460" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">RagController routes requests to modular services.</text><text x="96" y="487" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Ingestion: PDFBox for PDF; Tika for DOCX/TXT.</text><text x="96" y="514" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Retrieval: vector search; full-collection summaries.</text><text x="96" y="541" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Answers: Spring AI / OpenAI; extractive fallback.</text><text x="96" y="568" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Bounded async ingestion executor + audit records.</text><rect x="750" y="375" width="630" height="270" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="768" y="397" width="5" height="226" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="786" y="395" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">PYTHON  |  Primary backend</text><text x="786" y="433" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">FastAPI API + in-memory sessions</text><text x="786" y="460" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">app/api.py coordinates ingestion, retrieval, and chat.</text><text x="786" y="487" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Ingestion: Docling/OCR or native format parsers.</text><text x="786" y="514" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Retrieval: cached TF-IDF + optional dense rankings.</text><text x="786" y="541" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Answers: OpenAI orchestration; extractive fallback.</text><text x="786" y="568" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Async tasks + six ingestion slots + audit records.</text><rect x="60" y="710" width="630" height="180" rx="16" fill="#eaf7f3" stroke="#a2d7c7" stroke-width="2"/><rect x="78" y="732" width="5" height="136" rx="2" fill="#11634d" stroke="#11634d" stroke-width="2"/><text x="96" y="730" font-size="22" fill="#11634d" font-weight="700" dominant-baseline="text-before-edge">Java storage options</text><text x="96" y="768" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Memory: collections and chunks clear on restart.</text><text x="96" y="795" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">PostgreSQL + pgvector: persistent metadata/chunks.</text><text x="96" y="822" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cosine search + HNSW; queries scoped by collection.</text><text x="96" y="849" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Docker Compose deploys Java + React + PostgreSQL.</text><rect x="750" y="710" width="630" height="180" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="768" y="732" width="5" height="136" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="786" y="730" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">Python storage</text><text x="786" y="768" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">MemoryStore: collections, chunks, vectors, and audit.</text><text x="786" y="795" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Per-collection TF-IDF index cache for retrieval.</text><text x="786" y="822" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Application state clears when the process stops.</text><text x="786" y="849" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Run with uvicorn; separate from Compose deployment.</text><rect x="60" y="950" width="1320" height="145" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="78" y="972" width="5" height="101" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="96" y="970" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">Optional external providers  |  Calls originate from the selected backend</text><text x="96" y="1008" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Both: OpenAI embeddings, answer generation, or hosted File Search with a collection_id filter.</text><text x="96" y="1035" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Python also supports local Hugging Face Transformer embeddings; models download on first use.</text><text x="96" y="1062" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Hosted retrieval uploads originals to OpenAI; local retrieval parses, chunks, embeds, and indexes locally.</text><rect x="60" y="1130" width="1320" height="76" rx="16" fill="#fff8e7" stroke="#e9d59e" stroke-width="2"/><rect x="78" y="1152" width="5" height="32" rx="2" fill="#7b5c17" stroke="#7b5c17" stroke-width="2"/><text x="96" y="1150" font-size="22" fill="#7b5c17" font-weight="700" dominant-baseline="text-before-edge">Collections scope retrieval; authenticated accounts share instance-wide collection access.</text><text x="48" y="1222" font-size="16" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GATHER  /  Implementation workflows  /  Java + Python are primary backend options</text></g></svg>