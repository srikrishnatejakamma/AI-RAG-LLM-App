<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1480" viewBox="0 0 1440 1480" role="img" aria-labelledby="title desc"><title id="title">05  Authentication and access workflow</title><desc id="desc">The same user-facing session and role model applies to both primary backends.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="1480" fill="#f6f8fc"/><rect x="0" y="0" width="1440" height="120" rx="0" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="48" y="24" font-size="34" fill="#ffffff" font-weight="700" dominant-baseline="text-before-edge">05  Authentication and access workflow</text><text x="48" y="76" font-size="18" fill="#cfdeed" font-weight="400" dominant-baseline="text-before-edge">The same user-facing session and role model applies to both primary backends.</text><polyline points="720,290 720,345" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,345 713,333 727,333" fill="#72879b"/><polyline points="720,485 720,540" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,540 713,528 727,528" fill="#72879b"/><polyline points="1000,415 1050,415" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1050,415 1038,408 1038,422" fill="#72879b"/><polyline points="720,680 720,730 270,730 270,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="270,785 263,773 277,773" fill="#72879b"/><polyline points="720,730 720,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,785 713,773 727,773" fill="#72879b"/><polyline points="720,730 1170,730 1170,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1170,785 1163,773 1177,773" fill="#72879b"/><polyline points="270,995 270,1040 720,1040 720,1095" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1095 713,1083 727,1083" fill="#72879b"/><polyline points="720,995 720,1040 720,1040 720,1095" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1095 713,1083 727,1083" fill="#72879b"/><polyline points="1170,995 1170,1040 720,1040 720,1095" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1095 713,1083 727,1083" fill="#72879b"/><polyline points="720,1240 720,1295" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1295 713,1283 727,1283" fill="#72879b"/><rect x="320" y="155" width="800" height="135" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="338" y="177" width="5" height="91" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="356" y="175" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">1  Bootstrap CSRF protection</text><text x="356" y="213" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GET /api/csrf -&gt; token + headerName + parameterName.</text><text x="356" y="240" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Browser receives XSRF-TOKEN cookie; submits token with state-changing calls.</text><text x="356" y="267" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Health, CSRF bootstrap, and API documentation are publicly accessible.</text><rect x="440" y="345" width="560" height="140" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="458" y="367" width="5" height="96" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="476" y="365" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">2  Sign in</text><text x="476" y="403" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">POST /login with username, password, and CSRF.</text><text x="476" y="430" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Validate environment-provisioned account.</text><text x="476" y="457" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java verifies BCrypt-backed account credentials.</text><rect x="1050" y="345" width="330" height="140" rx="16" fill="#fff1ee" stroke="#efb9ac" stroke-width="2"/><rect x="1068" y="367" width="5" height="96" rx="2" fill="#a04432" stroke="#a04432" stroke-width="2"/><text x="1086" y="365" font-size="22" fill="#a04432" font-weight="700" dominant-baseline="text-before-edge">Access denied</text><text x="1086" y="403" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Bad credentials -&gt; HTTP 401.</text><text x="1086" y="430" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Bad CSRF -&gt; HTTP 403.</text><text x="1086" y="457" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No authorized action runs.</text><rect x="440" y="540" width="560" height="140" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="458" y="562" width="5" height="96" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="476" y="560" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">3  Establish and use a session</text><text x="476" y="598" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">JSESSIONID identifies the authenticated session.</text><text x="476" y="625" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Check authentication on protected API routes.</text><text x="476" y="652" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Check CSRF for POST / DELETE / other mutations.</text><rect x="60" y="785" width="420" height="210" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="78" y="807" width="5" height="166" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="96" y="805" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">VIEWER</text><text x="96" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">List collections and documents.</text><text x="96" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Ask questions about collections.</text><text x="96" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Inspect answers and source cards.</text><text x="96" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cannot upload or delete documents.</text><text x="96" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cannot access administrator audit.</text><rect x="510" y="785" width="420" height="210" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="528" y="807" width="5" height="166" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="546" y="805" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">EDITOR</text><text x="546" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">All viewer operations.</text><text x="546" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Create collections.</text><text x="546" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Upload and retry documents.</text><text x="546" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Delete individual documents.</text><text x="546" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cannot delete whole collections.</text><rect x="960" y="785" width="420" height="210" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="978" y="807" width="5" height="166" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="996" y="805" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">ADMIN</text><text x="996" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">All editor operations.</text><text x="996" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Delete entire collections.</text><text x="996" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Read GET /api/admin/audit.</text><text x="996" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Audit endpoint is cursor-paginated.</text><text x="996" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Accounts configured via environment.</text><rect x="320" y="1095" width="800" height="145" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="338" y="1117" width="5" height="101" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="356" y="1115" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">4  Scope data operations and record outcomes</text><text x="356" y="1153" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Collection IDs constrain retrieval, checksum lookups, and document operations.</text><text x="356" y="1180" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Audit records actor/action/outcome/resource; omit question and document text.</text><text x="356" y="1207" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Collection access is instance-wide across authenticated accounts.</text><rect x="60" y="1295" width="1320" height="115" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="78" y="1317" width="5" height="71" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="96" y="1315" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">5  Sign out</text><text x="96" y="1353" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">POST /logout with CSRF -&gt; invalidate session and remove the session cookie.</text><text x="96" y="1380" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Subsequent protected calls require authentication again.</text><text x="48" y="1442" font-size="16" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GATHER  /  Implementation workflows  /  Java + Python are primary backend options</text></g></svg>