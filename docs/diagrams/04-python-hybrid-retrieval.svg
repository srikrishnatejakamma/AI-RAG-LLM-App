<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc"><title id="title">04  Python retrieval and answer routing</title><desc id="desc">Python-specific details: query preparation, date extraction, lexical/dense fusion, and evidence recovery.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="1800" fill="#f6f8fc"/><rect x="0" y="0" width="1440" height="120" rx="0" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="48" y="24" font-size="34" fill="#ffffff" font-weight="700" dominant-baseline="text-before-edge">04  Python retrieval and answer routing</text><text x="48" y="76" font-size="18" fill="#cfdeed" font-weight="400" dominant-baseline="text-before-edge">Python-specific details: query preparation, date extraction, lexical/dense fusion, and evidence recovery.</text><polyline points="720,300 720,350" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,350 713,338 727,338" fill="#72879b"/><polyline points="1000,420 1050,420" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1050,420 1038,413 1038,427" fill="#72879b"/><polyline points="720,490 720,545" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,545 713,533 727,533" fill="#72879b"/><polyline points="1000,615 1050,615" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1050,615 1038,608 1038,622" fill="#72879b"/><polyline points="720,685 720,730 270,730 270,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="270,785 263,773 277,773" fill="#72879b"/><polyline points="720,730 720,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,785 713,773 727,773" fill="#72879b"/><polyline points="720,730 1170,730 1170,785" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1170,785 1163,773 1177,773" fill="#72879b"/><polyline points="270,995 270,1040 720,1040 720,1090" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1090 713,1078 727,1078" fill="#72879b"/><polyline points="720,995 720,1040 720,1040 720,1090" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1090 713,1078 727,1078" fill="#72879b"/><polyline points="1170,995 1170,1040 720,1040 720,1090" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1090 713,1078 727,1078" fill="#72879b"/><polyline points="720,1235 720,1290" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1290 713,1278 727,1278" fill="#72879b"/><polyline points="720,1435 720,1490" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1490 713,1478 727,1478" fill="#72879b"/><rect x="320" y="155" width="800" height="145" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="338" y="177" width="5" height="101" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="356" y="175" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">1  Build collection context and normalize the query</text><text x="356" y="213" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Use READY chunks, section outlines, and source locations from this collection.</text><text x="356" y="240" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Correct query spelling; contextualize follow-ups with the last eight messages.</text><text x="356" y="267" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Detect overview intent and extract date/deadline facts where applicable.</text><rect x="440" y="350" width="560" height="140" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="458" y="372" width="5" height="96" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="476" y="370" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">2  Date or deadline facts found?</text><text x="476" y="408" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Yes: format facts + citations and return immediately.</text><text x="476" y="435" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No: continue to configured retrieval provider.</text><text x="476" y="462" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Overview intent can expand retrieval to 20 results.</text><rect x="1050" y="350" width="330" height="140" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="1068" y="372" width="5" height="96" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="1086" y="370" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">Direct fact answer</text><text x="1086" y="408" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cite the source chunks.</text><text x="1086" y="435" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Set grounded: true.</text><text x="1086" y="462" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Record GROUNDED audit.</text><rect x="440" y="545" width="560" height="140" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="458" y="567" width="5" height="96" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="476" y="565" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">3  Select retrieval provider</text><text x="476" y="603" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">openai-file-search: hosted collection-filtered path.</text><text x="476" y="630" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">local: build query vector and retrieve below.</text><text x="476" y="657" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Local mode caches TF-IDF per collection.</text><rect x="1050" y="545" width="330" height="140" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="1068" y="567" width="5" height="96" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="1086" y="565" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">Hosted path</text><text x="1086" y="603" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Responses + file_search.</text><text x="1086" y="630" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Validate citations and answer.</text><text x="1086" y="657" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">See question-answer diagram.</text><rect x="60" y="785" width="420" height="210" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="78" y="807" width="5" height="166" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="96" y="805" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">4A  Dense similarity</text><text x="96" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Cosine similarity over chunk vectors.</text><text x="96" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Apply minimum dense score.</text><text x="96" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Transformers / OpenAI: weight 1.0.</text><text x="96" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Default hashing mode: weight 0.0.</text><text x="96" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Hashing is not a semantic model.</text><rect x="510" y="785" width="420" height="210" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="528" y="807" width="5" height="166" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="546" y="805" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">4B  Word TF-IDF</text><text x="546" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Fit vocabulary to collection chunks.</text><text x="546" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Word unigrams + bigrams.</text><text x="546" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Sublinear TF and cosine similarity.</text><text x="546" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Keep positive lexical matches.</text><text x="546" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Rank fusion weight: 1.0.</text><rect x="960" y="785" width="420" height="210" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="978" y="807" width="5" height="166" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="996" y="805" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">4C  Character TF-IDF</text><text x="996" y="843" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Character n-grams of length 3-5.</text><text x="996" y="870" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Query with near-miss terms only.</text><text x="996" y="897" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Vocabulary similarity at least 0.84.</text><text x="996" y="924" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Provides spelling tolerance.</text><text x="996" y="951" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Rank fusion weight: 0.75.</text><rect x="320" y="1090" width="800" height="145" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="338" y="1112" width="5" height="101" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="356" y="1110" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">5  Reciprocal rank fusion (RRF)</text><text x="356" y="1148" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">For each ranked source: fused score += weight / (10 + rank).</text><text x="356" y="1175" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Sort fused scores; return top-k chunks with document and source metadata.</text><text x="356" y="1202" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Reuse a cache only while its chunk IDs match; retain at most 32 collections.</text><rect x="320" y="1290" width="800" height="145" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="338" y="1312" width="5" height="101" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="356" y="1310" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">6  Generate an answer or extract relevant passages</text><text x="356" y="1348" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No matches: return processing/no-evidence message with grounded: false.</text><text x="356" y="1375" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Otherwise use OpenAI if available; extractive fallback on absence/failure.</text><text x="356" y="1402" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Overview fallback uses collection context, section paths, and section outlines.</text><rect x="320" y="1490" width="800" height="180" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="338" y="1512" width="5" height="136" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="356" y="1510" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">7  Recover missed evidence and finalize</text><text x="356" y="1548" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Unsupported focused answer: retry extraction over all READY collection chunks.</text><text x="356" y="1575" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Recover citations by matching extracted sentences back to their source chunks.</text><text x="356" y="1602" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Still unsupported: return grounded: false and an empty source list.</text><text x="356" y="1629" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Otherwise return answer + citations + grounded: true; record audit outcome.</text><text x="48" y="1762" font-size="16" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GATHER  /  Implementation workflows  /  Java + Python are primary backend options</text></g></svg>