<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc"><title id="title">02  Document ingestion lifecycle</title><desc id="desc">Shared upload lifecycle, with explicit Java and Python processing paths and retry behavior.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="1800" fill="#f6f8fc"/><rect x="0" y="0" width="1440" height="120" rx="0" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="48" y="24" font-size="34" fill="#ffffff" font-weight="700" dominant-baseline="text-before-edge">02  Document ingestion lifecycle</text><text x="48" y="76" font-size="18" fill="#cfdeed" font-weight="400" dominant-baseline="text-before-edge">Shared upload lifecycle, with explicit Java and Python processing paths and retry behavior.</text><polyline points="700,290 700,345" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="700,345 693,333 707,333" fill="#72879b"/><polyline points="700,485 700,540" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="700,540 693,528 707,528" fill="#72879b"/><polyline points="700,680 700,735" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="700,735 693,723 707,723" fill="#72879b"/><polyline points="980,410 1040,410" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1040,410 1028,403 1028,417" fill="#72879b"/><polyline points="980,610 1040,610" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1040,610 1028,603 1028,617" fill="#72879b"/><polyline points="700,880 700,920 270,920 270,970" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="270,970 263,958 277,958" fill="#72879b"/><text x="90" y="930" font-size="16" fill="#72879b" font-weight="700" dominant-baseline="text-before-edge">Local / Java</text><polyline points="700,920 720,920 720,970" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,970 713,958 727,958" fill="#72879b"/><text x="600" y="930" font-size="16" fill="#72879b" font-weight="700" dominant-baseline="text-before-edge">Local / Python</text><polyline points="700,920 1170,920 1170,970" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="1170,970 1163,958 1177,958" fill="#72879b"/><text x="1060" y="930" font-size="16" fill="#72879b" font-weight="700" dominant-baseline="text-before-edge">Hosted / either</text><polyline points="270,1180 270,1235" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="270,1235 263,1223 277,1223" fill="#72879b"/><polyline points="720,1180 720,1235" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1235 713,1223 727,1223" fill="#72879b"/><polyline points="270,1415 270,1470 700,1470 700,1510" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="700,1510 693,1498 707,1498" fill="#72879b"/><polyline points="720,1415 720,1510" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1510 713,1498 727,1498" fill="#72879b"/><polyline points="1170,1180 1170,1470 720,1470" fill="none" stroke="#72879b" stroke-width="3" stroke-linejoin="round"/><polygon points="720,1470 732,1463 732,1477" fill="#72879b"/><rect x="420" y="155" width="560" height="135" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="438" y="177" width="5" height="91" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="456" y="175" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">1  Upload to the selected collection</text><text x="456" y="213" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">POST /api/collections/{id}/documents</text><text x="456" y="240" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Multipart file + session cookie + CSRF header.</text><text x="456" y="267" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">ADMIN or EDITOR role required.</text><rect x="420" y="345" width="560" height="140" rx="16" fill="#ffffff" stroke="#d6e1eb" stroke-width="2"/><rect x="438" y="367" width="5" height="96" rx="2" fill="#142b43" stroke="#142b43" stroke-width="2"/><text x="456" y="365" font-size="22" fill="#142b43" font-weight="700" dominant-baseline="text-before-edge">2  Validate the upload</text><text x="456" y="403" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Collection exists; filename reduced to basename.</text><text x="456" y="430" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Non-empty PDF, DOCX, or TXT; default limit 10 MB.</text><text x="456" y="457" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Check format signature / detected content type.</text><rect x="1040" y="345" width="340" height="140" rx="16" fill="#fff1ee" stroke="#efb9ac" stroke-width="2"/><rect x="1058" y="367" width="5" height="96" rx="2" fill="#a04432" stroke="#a04432" stroke-width="2"/><text x="1076" y="365" font-size="22" fill="#a04432" font-weight="700" dominant-baseline="text-before-edge">Rejected request</text><text x="1076" y="403" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Invalid type, size, or collection.</text><text x="1076" y="430" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Return an API error.</text><text x="1076" y="457" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">No ingestion is scheduled.</text><rect x="420" y="540" width="560" height="140" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="438" y="562" width="5" height="96" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="456" y="560" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">3  Deduplicate with SHA-256</text><text x="456" y="598" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Lookup checksum within the selected collection.</text><text x="456" y="625" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Existing READY / PROCESSING: return HTTP 200.</text><text x="456" y="652" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Existing FAILED: retry the same document.</text><rect x="1040" y="540" width="340" height="140" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="1058" y="562" width="5" height="96" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="1076" y="560" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">Already present</text><text x="1076" y="598" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Return existing document.</text><text x="1076" y="625" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Reuse its ID and status.</text><text x="1076" y="652" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Avoid duplicate indexing.</text><rect x="420" y="735" width="560" height="145" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="438" y="757" width="5" height="101" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="456" y="755" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">4  Reserve capacity and queue processing</text><text x="456" y="793" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Mark PROCESSING; HTTP 202 when accepted.</text><text x="456" y="820" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Java: bounded executor. Python: six task slots.</text><text x="456" y="847" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Full capacity: return an error; retry shortly.</text><rect x="60" y="970" width="420" height="210" rx="16" fill="#eaf7f3" stroke="#a2d7c7" stroke-width="2"/><rect x="78" y="992" width="5" height="166" rx="2" fill="#11634d" stroke="#11634d" stroke-width="2"/><text x="96" y="990" font-size="22" fill="#11634d" font-weight="700" dominant-baseline="text-before-edge">5A  Java local parsing</text><text x="96" y="1028" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">PDF: PDFBox, preserving page numbers.</text><text x="96" y="1055" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">DOCX/TXT: Apache Tika extraction.</text><text x="96" y="1082" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Normalize text; overlapping chunks.</text><text x="96" y="1109" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Defaults: 1,200 chars / 180 overlap.</text><text x="96" y="1136" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Reject empty text or &gt;1,800 chunks.</text><rect x="510" y="970" width="420" height="210" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="528" y="992" width="5" height="166" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="546" y="990" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">5B  Python local parsing</text><text x="546" y="1028" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Docling: layout, tables, optional OCR.</text><text x="546" y="1055" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Auto mode can use native fallback.</text><text x="546" y="1082" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Native: pypdf / python-docx / TXT.</text><text x="546" y="1109" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Build chunks + source locations.</text><text x="546" y="1136" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Reject empty text or &gt;1,800 chunks.</text><rect x="960" y="970" width="420" height="210" rx="16" fill="#f2efff" stroke="#c9bfec" stroke-width="2"/><rect x="978" y="992" width="5" height="166" rx="2" fill="#63459b" stroke="#63459b" stroke-width="2"/><text x="996" y="990" font-size="22" fill="#63459b" font-weight="700" dominant-baseline="text-before-edge">5C  Hosted File Search</text><text x="996" y="1028" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Upload original file to OpenAI.</text><text x="996" y="1055" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Attach to configured vector store.</text><text x="996" y="1082" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Set collection_id + document_id.</text><text x="996" y="1109" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Poll until indexing completes.</text><text x="996" y="1136" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Persist the remote file identifier.</text><rect x="60" y="1235" width="420" height="180" rx="16" fill="#eaf7f3" stroke="#a2d7c7" stroke-width="2"/><rect x="78" y="1257" width="5" height="136" rx="2" fill="#11634d" stroke="#11634d" stroke-width="2"/><text x="96" y="1255" font-size="22" fill="#11634d" font-weight="700" dominant-baseline="text-before-edge">6A  Java embeddings + storage</text><text x="96" y="1293" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Feature hashing or OpenAI vectors.</text><text x="96" y="1320" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Embed chunks; preserve PDF pages.</text><text x="96" y="1347" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Store in memory or PostgreSQL.</text><text x="96" y="1374" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Complete the document index.</text><rect x="510" y="1235" width="420" height="180" rx="16" fill="#edf3ff" stroke="#b1c7ed" stroke-width="2"/><rect x="528" y="1257" width="5" height="136" rx="2" fill="#254f99" stroke="#254f99" stroke-width="2"/><text x="546" y="1255" font-size="22" fill="#254f99" font-weight="700" dominant-baseline="text-before-edge">6B  Python embeddings + storage</text><text x="546" y="1293" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Hashing / Transformers / OpenAI.</text><text x="546" y="1320" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Embed chunks into MemoryStore.</text><text x="546" y="1347" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Keep text + location metadata.</text><text x="546" y="1374" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">TF-IDF cache refreshes on retrieval.</text><rect x="420" y="1510" width="560" height="135" rx="16" fill="#eaf7ee" stroke="#a9d7b5" stroke-width="2"/><rect x="438" y="1532" width="5" height="91" rx="2" fill="#25653a" stroke="#25653a" stroke-width="2"/><text x="456" y="1530" font-size="22" fill="#25653a" font-weight="700" dominant-baseline="text-before-edge">7  READY and available for questions</text><text x="456" y="1568" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Record ingestion-completed audit event.</text><text x="456" y="1595" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">React polls document status every 2.5 seconds.</text><text x="456" y="1622" font-size="18" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">Only READY documents supply evidence.</text><rect x="60" y="1680" width="1320" height="76" rx="16" fill="#fff1ee" stroke="#efb9ac" stroke-width="2"/><rect x="78" y="1702" width="5" height="32" rx="2" fill="#a04432" stroke="#a04432" stroke-width="2"/><text x="96" y="1700" font-size="22" fill="#a04432" font-weight="700" dominant-baseline="text-before-edge">Worker failure -&gt; FAILED + error + audit; re-upload the same file to retry processing.</text><text x="48" y="1762" font-size="16" fill="#496079" font-weight="400" dominant-baseline="text-before-edge">GATHER  /  Implementation workflows  /  Java + Python are primary backend options</text></g></svg>