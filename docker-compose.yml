services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./java-backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      dockerfile: java-backend/Dockerfile
    environment:
      PORT: 8080
      RAG_STORAGE: postgres
      RAG_DATABASE_URL: jdbc:postgresql://postgres:5432/rag
      RAG_DATABASE_USER: rag
      RAG_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-admin}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-admin}
      RAG_EDITOR_USERNAME: ${RAG_EDITOR_USERNAME:-}
      RAG_EDITOR_PASSWORD: ${RAG_EDITOR_PASSWORD:-}
      RAG_VIEWER_USERNAME: ${RAG_VIEWER_USERNAME:-}
      RAG_VIEWER_PASSWORD: ${RAG_VIEWER_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-local}
      RAG_RETRIEVAL_PROVIDER: ${RAG_RETRIEVAL_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_VECTOR_STORE_ID: ${OPENAI_VECTOR_STORE_ID:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
